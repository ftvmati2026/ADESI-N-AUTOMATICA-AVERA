  <!-- Ribbon Bar with Badges matching Imagen 2 exactly -->
  <g id="ribbon">
    <!-- Main Green Pill Bar -->
    <rect x="25" y="192" width="390" height="46" rx="23" fill="#4ea42e" />

    <!-- Left Wing Cutout Arch -->
    <path d="M125 192 C140 202 146 215 146 215 C146 215 140 228 125 238 L152 238 C164 228 170 215 170 215 C170 215 164 202 152 192 Z" fill="white" />

    <!-- Right Wing Cutout Arch -->
    <path d="M315 192 C300 202 294 215 294 215 C294 215 300 228 315 238 L288 238 C276 228 270 215 270 215 C270 215 276 202 288 192 Z" fill="white" />

    <!-- Badge 1: Diamante Dorado (Left) -->
    <g transform="translate(172, 215)">
      <circle cx="0" cy="0" r="17" fill="#4ea42e" stroke="#3f8824" stroke-width="1.2" />
      <!-- Faceted Diamond -->
      <path d="M0 -11 L9 -1.5 L0 11 L-9 -1.5 Z" fill="#f8b022" />
      <path d="M0 -11 L0 11 L-9 -1.5 Z" fill="#ef7924" opacity="0.65" />
      <path d="M-9 -1.5 L9 -1.5 L0 0 Z" fill="#fde047" />
    </g>

    <!-- Badge 2: Estetoscopio Dorado (Center) -->
    <g transform="translate(220, 215)">
      <circle cx="0" cy="0" r="17" fill="#4ea42e" stroke="#3f8824" stroke-width="1.2" />
      <!-- Stethoscope curve -->
      <path d="M-7.5 -9.5 C-7.5 -2.5 -3.5 5 0 7 C3.5 5 7.5 -2.5 7.5 -9.5 M-7.5 -9.5 L-5 -9.5 M7.5 -9.5 L5 -9.5 M0 7 L0 10.5 M0 10.5 A4.5 4.5 0 1 0 4.5 15" 
            stroke="#f8b022" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    </g>

    <!-- Badge 3: Familia y Manos Doradas (Right) -->
    <g transform="translate(268, 215)">
      <circle cx="0" cy="0" r="17" fill="#4ea42e" stroke="#3f8824" stroke-width="1.2" />
      <!-- Head -->
      <circle cx="0" cy="-6" r="2.6" fill="#f8b022" />
      <!-- Body -->
      <path d="M-5.5 0.5 C-5.5 -3 5.5 -3 5.5 0.5 L4.2 5.5 L-4.2 5.5 Z" fill="#f8b022" />
